<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Coworking Space</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main>
        <section class="hero">
            <h1 class="anim-text">Work Differently.</h1>
            <p class="anim-text">Premium spaces for modern creators.</p>
        </section>

        <section class="features">
            <div class="feature-card">High Speed Wifi</div>
            <div class="feature-card">Free Coffee</div>
            <div class="feature-card">Meeting Rooms</div>
        </section>

        <section class="gallery">
            <h2>Our Spaces</h2>
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">Open Space</div>
                    <div class="swiper-slide">Private Office</div>
                    <div class="swiper-slide">Chill Zone</div>
                </div>
                <div class="swiper-pagination"></div>
            </div>
        </section>

        <section class="footer">
            <h2>Join us today</h2>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    
    <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script src="js/script.js"></script>
</body>
</html>
